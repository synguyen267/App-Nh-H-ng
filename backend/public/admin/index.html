<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý thực đơn</title>
<style>
:root{--do:#D0281E;--nhat:#FDECEA;--chu:#1A1A1A;--mo:#8E8E93;--vien:#EAEAEA;--phu:#F6F6F7;--xanh:#1E9E5A}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--chu);background:#fff}
.khung{max-width:960px;margin:0 auto;padding:20px 16px 60px}
.dau{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.dau h1{font-size:22px;margin:0;flex:1}
button{font:inherit;cursor:pointer}
.nut{background:var(--do);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:800}
.nut.phu{background:#fff;color:var(--chu);border:1.5px solid var(--vien)}
.loc{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--vien);background:var(--phu);border-radius:20px;padding:6px 14px;font-weight:700;color:var(--mo)}
.chip.on{background:var(--nhat);border-color:var(--do);color:var(--do)}
.dong{display:flex;align-items:center;gap:12px;border:1px solid var(--vien);border-radius:14px;padding:10px;margin-bottom:10px}
.dong.het img{opacity:.4}
.dong img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--phu);flex:none}
.tt{flex:1;min-width:0}
.tt b{display:block}
.tt small{color:var(--mo);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gia{color:var(--do);font-weight:800;white-space:nowrap}
.sw{display:block;position:relative;width:44px;height:26px;margin:0 auto}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;background:#C9C9CE;border-radius:13px;transition:.15s}
.sw span:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--xanh)}
.sw input:checked+span:after{left:21px}
.nhan{font-size:11px;color:var(--mo);text-align:center;width:64px;margin-top:3px;white-space:nowrap}
.hd{background:none;border:0;color:var(--mo);font-weight:700;padding:6px}
.hd.xoa{color:var(--do)}
dialog{border:0;border-radius:16px;padding:0;width:min(480px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
form{padding:20px}
form h2{margin:0 0 14px;font-size:18px}
label.o{display:block;font-weight:700;font-size:13px;margin-bottom:12px}
label.o input,label.o textarea{display:block;width:100%;margin-top:5px;font:inherit;padding:10px;border:1.5px solid var(--vien);border-radius:10px}
label.o input:focus,label.o textarea:focus{outline:0;border-color:var(--do)}
.anh{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.anh img{width:88px;height:88px;border-radius:12px;object-fit:cover;background:var(--phu);border:1px solid var(--vien)}
.hang{display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--chu);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:.2s}
#toast.hien{opacity:1}#toast.loi{background:var(--do)}
</style>
</head>
<body>
<div class="khung">
  <div class="dau"><h1>Quản lý thực đơn</h1><button class="nut" id="them">+ Thêm món</button></div>
  <div class="loc" id="loc"></div>
  <div id="ds"></div>
</div>

<dialog id="hop">
  <form id="form">
    <h2 id="tieuDe"></h2>
    <div class="anh">
      <img id="xem" alt="">
      <div><input type="file" id="file" accept="image/*"><div style="font-size:12px;color:var(--mo);margin-top:6px">Ảnh tự thu nhỏ trước khi tải lên</div></div>
    </div>
    <label class="o">Tên món<input id="ten" required></label>
    <label class="o">Giá (đ)<input id="gia" type="number" min="0" step="1000" required></label>
    <label class="o">Loại<input id="loai" list="dsLoai" required placeholder="Khai vị, Món chính..."></label>
    <datalist id="dsLoai"></datalist>
    <label class="o">Mô tả<textarea id="moTa" rows="2"></textarea></label>
    <div class="hang"><button type="button" class="nut phu" id="huy">Hủy</button><button class="nut" id="luu">Lưu</button></div>
  </form>
</dialog>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
let ds = [], loc = 'Tất cả', sua = null, anhMoi = null;
const fmt = (n) => Number(n).toLocaleString('vi-VN') + 'đ';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg, loi) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'hien' + (loi ? ' loi' : '');
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.className = ''), 3000);
}
async function goi(url, opt) {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opt });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error([].concat(d.message || 'Có lỗi xảy ra').join(', '));
  return d;
}
async function tai() {
  try { ds = await goi('/api/monan'); ve(); } catch (e) { toast('Không tải được thực đơn: ' + e.message, true); }
}
function ve() {
  const loais = ['Tất cả', ...new Set(ds.map((m) => m.loai))];
  if (!loais.includes(loc)) loc = 'Tất cả';
  $('#loc').innerHTML = loais.map((l) => `<button class="chip ${l === loc ? 'on' : ''}" data-l="${esc(l)}">${esc(l)}</button>`).join('');
  $('#dsLoai').innerHTML = loais.slice(1).map((l) => `<option value="${esc(l)}">`).join('');
  $('#ds').innerHTML = ds.filter((m) => loc === 'Tất cả' || m.loai === loc).map((m) => `
    <div class="dong ${m.conHang ? '' : 'het'}">
      <img src="${esc(m.hinhAnh || '')}" alt="" onerror="this.style.visibility='hidden'">
      <div class="tt"><b>${esc(m.ten)}</b><small>${esc(m.loai)} · ${esc(m.moTa || '')}</small></div>
      <div class="gia">${fmt(m.gia)}</div>
      <div><label class="sw"><input type="checkbox" data-cb="${m.id}" ${m.conHang ? 'checked' : ''}><span></span></label><div class="nhan">${m.conHang ? 'Còn hàng' : 'Hết hàng'}</div></div>
      <div><button class="hd" data-sua="${m.id}">Sửa</button><button class="hd xoa" data-xoa="${m.id}">Xóa</button></div>
    </div>`).join('') || '<p style="color:var(--mo)">Chưa có món nào</p>';
}
function mo(m) {
  sua = m; anhMoi = null;
  $('#tieuDe').textContent = m ? 'Sửa món' : 'Thêm món';
  $('#ten').value = m?.ten || ''; $('#gia').value = m?.gia ?? ''; $('#loai').value = m?.loai || (loc !== 'Tất cả' ? loc : '');
  $('#moTa').value = m?.moTa || ''; $('#file').value = '';
  $('#xem').src = m?.hinhAnh || '';
  $('#hop').showModal();
}
// Thu nhỏ ảnh (tối đa 1200px) rồi chuyển thành JPEG để tải lên nhẹ
function thuNho(file) {
  return new Promise((ok, loi) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1200 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => loi(new Error('Không đọc được ảnh'));
    img.src = url;
  });
}

$('#them').onclick = () => mo(null);
$('#huy').onclick = () => $('#hop').close();
$('#file').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { anhMoi = await thuNho(f); $('#xem').src = anhMoi; } catch (err) { toast(err.message, true); }
};
$('#loc').onclick = (e) => { const l = e.target.dataset.l; if (l) { loc = l; ve(); } };
$('#ds').onclick = async (e) => {
  const s = e.target.dataset;
  if (s.sua) mo(ds.find((m) => m.id == s.sua));
  if (s.xoa) {
    const m = ds.find((x) => x.id == s.xoa);
    if (!confirm(`Xóa món "${m.ten}"?`)) return;
    try { await goi('/api/monan/' + m.id, { method: 'DELETE' }); toast('Đã xóa'); tai(); }
    catch { toast('Không xóa được (món có thể đã nằm trong đơn hàng). Hãy tắt "Còn hàng" thay vì xóa.', true); }
  }
};
$('#ds').onchange = async (e) => {
  const id = e.target.dataset.cb; if (!id) return;
  try { await goi('/api/monan/' + id, { method: 'PUT', body: JSON.stringify({ conHang: e.target.checked }) }); tai(); }
  catch (err) { toast(err.message, true); tai(); }
};
$('#form').onsubmit = async (e) => {
  e.preventDefault();
  const body = { ten: $('#ten').value.trim(), gia: Number($('#gia').value), loai: $('#loai').value.trim(), moTa: $('#moTa').value.trim() };
  $('#luu').disabled = true;
  try {
    if (anhMoi) body.hinhAnh = (await goi('/api/upload', { method: 'POST', body: JSON.stringify({ ten: body.ten, duLieu: anhMoi }) })).hinhAnh;
    if (sua) await goi('/api/monan/' + sua.id, { method: 'PUT', body: JSON.stringify(body) });
    else await goi('/api/monan', { method: 'POST', body: JSON.stringify(body) });
    $('#hop').close(); toast('Đã lưu'); tai();
  } catch (err) { toast(err.message, true); }
  $('#luu').disabled = false;
};
tai();
</script>
</body>
</html>
